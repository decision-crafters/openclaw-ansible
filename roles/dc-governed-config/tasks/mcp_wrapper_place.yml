---
# Place the stdio wrapper for ONE MCP server and attest the server package it
# execs — from an artifact, without installing anything and without reading a
# credential.
#
#   sudo ansible-playbook playbooks/governed-admission.yml \
#     --tags mcp-wrapper -e dc_mcp_wrapper_path=/path/to/wrapper.json \
#     -e ansible_become=false [-e dc_apply=true]
#
# WHY THIS EXISTS
#
# mcp_register.yml refuses a stdio `command` that is not the service account's
# own 0700 file. Something has to put that file there in a governed way, and
# the file execs a server package that is a NEW first-party/community artifact
# on the host — it needs identity and provenance evidence before it is wired
# to the Gateway (TASK-323 admission packet, supply-chain residual).
#
# WHAT THIS PLAY DOES, AND DOES NOT
#
#   does:   proves the wrapper SOURCE and every file in the artifact's `files`
#           map (the adapter, the cohort packet) are the reviewed bytes (sha256)
#           and carry no token-shaped value or placeholder; proves the runtime
#           interpreter meets the declared floor; proves the env file exists as
#           the service account's 0600 file (stat only); then (apply) places the
#           wrapper 0700 and each file at its declared mode, owner:group service
#           account, reads every stat back, and emits a receipt that IS the
#           provenance line.
#   does not: install any package, read the env file (never slurp), register
#           anything, restart anything.

- name: Establish the CLI and confirm its verbs
  ansible.builtin.include_tasks: agent_common.yml

- name: Refuse without a wrapper artifact
  ansible.builtin.assert:
    that:
      - dc_mcp_wrapper_path | default('') | length > 0
    fail_msg: >-
      dc_mcp_wrapper_path must name a wrapper artifact ({"wrapper": {...},
      "env_file": {...}, "server_package": {...}, "authority": {...}}).
      Nothing has been read.
    success_msg: "reading {{ dc_mcp_wrapper_path }}"

- name: Read the wrapper artifact
  ansible.builtin.slurp:
    src: "{{ dc_mcp_wrapper_path }}"
  register: dc_mcpw_raw
  delegate_to: localhost
  become: false

- name: Parse the artifact
  ansible.builtin.set_fact:
    dc_mcpw: "{{ dc_mcpw_raw.content | b64decode | from_json }}"
  failed_when: false

- name: Refuse an artifact that will not parse or is incomplete
  ansible.builtin.fail:
    msg: >-
      {{ dc_mcp_wrapper_path }} is not valid JSON or lacks wrapper.source,
      wrapper.dest, wrapper.expected_sha256, env_file.path, a non-empty files map,
      runtime.binary, runtime.min_version, server_package.entrypoint,
      server_package.entrypoint_sha256, server_package.name or
      server_package.version. Nothing has been changed.
  when:
    - >-
      dc_mcpw is not defined
      or (dc_mcpw.wrapper.source | default('') | length) == 0
      or (dc_mcpw.wrapper.dest | default('') | length) == 0
      or (dc_mcpw.wrapper.expected_sha256 | default('') | length) == 0
      or (dc_mcpw.env_file.path | default('') | length) == 0
      or (dc_mcpw.files | default({}) | length) == 0
      or (dc_mcpw.runtime.binary | default('') | length) == 0
      or (dc_mcpw.runtime.min_version | default('') | length) == 0
      or (dc_mcpw.server_package.entrypoint | default('') | length) == 0
      or (dc_mcpw.server_package.entrypoint_sha256 | default('') | length) == 0
      or (dc_mcpw.server_package.name | default('') | length) == 0
      or (dc_mcpw.server_package.version | default('') | length) == 0
    - dc_fail_closed | bool

- name: Refuse an artifact that names no canonical authority
  ansible.builtin.fail:
    msg: >-
      The artifact carries no authority.task_id / authority.decision_memory_page_id.
      Nothing has been changed.
  when:
    - >-
      (dc_mcpw.authority.task_id | default('') | length) == 0
      or (dc_mcpw.authority.decision_memory_page_id | default('') | length) == 0
    - dc_fail_closed | bool

- name: Refuse an artifact that still carries template placeholders
  ansible.builtin.fail:
    msg: >-
      The artifact contains a <placeholder> in wrapper, env_file, files, runtime or
      server_package (placed_by / placed_at / source_head are filled by the person
      placing and are checked by the receipt, not here). An unfilled artifact
      cannot attest. Nothing has been changed.
  when:
    - >-
      ({'wrapper': dc_mcpw.wrapper, 'env_file': dc_mcpw.env_file, 'files': dc_mcpw.files, 'runtime': dc_mcpw.runtime,
        'server_package': (dc_mcpw.server_package | dict2items
                           | rejectattr('key', 'in', ['placed_by', 'placed_at', 'source_head']) | items2dict)}
       | to_json | regex_search('<[^>]*>')) is not none
    - dc_fail_closed | bool

# --- the wrapper source: the reviewed bytes, and nothing secret in them --------
- name: Read the wrapper source from beside the artifact
  ansible.builtin.slurp:
    src: "{{ (dc_mcp_wrapper_path | dirname) }}/{{ dc_mcpw.wrapper.source | basename }}"
  register: dc_mcpw_src
  delegate_to: localhost
  become: false

- name: Refuse a wrapper source that is not the reviewed one or carries a secret shape
  ansible.builtin.assert:
    that:
      - (dc_mcpw_src.content | b64decode | hash('sha256')) == dc_mcpw.wrapper.expected_sha256
      - not (dc_mcpw_src.content | b64decode | regex_replace('[-_]{4,}', '') | regex_search('[A-Za-z0-9_-]{40,}'))
      - not (dc_mcpw_src.content | b64decode | regex_search('(secret_|ntn_)[A-Za-z0-9]'))
      - (dc_mcpw_src.content | b64decode) is search('^#!/')
    fail_msg: >-
      The wrapper source does not hash to wrapper.expected_sha256, or contains a
      token-shaped value, or is not a script. The placed file must be the reviewed
      one and must carry no credential. Nothing has been changed.
    success_msg: >-
      wrapper source is the reviewed file ({{ dc_mcpw.wrapper.expected_sha256[:16] }}…)
      and carries no secret shape

# --- attestations on the host, as the service account, never reading the env file ---
- name: Stat the env file (existence, owner, mode only)
  ansible.builtin.stat:
    path: "{{ dc_mcpw.env_file.path }}"
    get_mime: false
    get_checksum: false
  register: dc_mcpw_env
  become: true
  become_user: "{{ dc_openclaw_user }}"

- name: Refuse when the credential file is absent or not the service account's 0600 file
  ansible.builtin.fail:
    msg: >-
      {{ dc_mcpw.env_file.path }} must exist as a regular file owned by
      {{ dc_openclaw_user }}:{{ dc_openclaw_user }} with mode {{ dc_mcpw.env_file.mode | default('0600') }}
      (exists={{ dc_mcpw_env.stat.exists | default(false) }},
      owner={{ dc_mcpw_env.stat.pw_name | default('?') }}, mode={{ dc_mcpw_env.stat.mode | default('?') }}).
      Its content was not read and never is. Nothing has been changed.
  when:
    - >-
      not (dc_mcpw_env.stat.exists | default(false))
      or not (dc_mcpw_env.stat.isreg | default(false))
      or (dc_mcpw_env.stat.pw_name | default('')) != dc_openclaw_user
      or (dc_mcpw_env.stat.mode | default('')) != (dc_mcpw.env_file.mode | default('0600'))
    - dc_fail_closed | bool

# The runtime the wrapper execs — declared in the artifact (binary, version args,
# floor). Read as the service account; refuse below the floor rather than
# registering a server that dies at first spawn.
- name: Read the runtime version as the service account
  ansible.builtin.command:
    argv: "{{ [dc_mcpw.runtime.binary] + (dc_mcpw.runtime.version_args | default(['--version'])) }}"
  register: dc_mcpw_rt
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ dc_openclaw_user }}"

- name: Refuse when the runtime is absent or below the declared floor
  ansible.builtin.assert:
    that:
      - (dc_mcpw_rt.rc | default(1)) == 0
      - >-
        ((dc_mcpw_rt.stdout ~ ' ' ~ dc_mcpw_rt.stderr) | regex_search('[0-9]+\\.[0-9]+') | default('0.0', true))
        is version(dc_mcpw.runtime.min_version, '>=')
    fail_msg: >-
      {{ dc_mcpw.runtime.binary }} as {{ dc_openclaw_user }}: rc={{ dc_mcpw_rt.rc | default('?') }},
      output={{ (dc_mcpw_rt.stdout ~ ' ' ~ dc_mcpw_rt.stderr) | trim | truncate(80) }};
      the artifact requires >= {{ dc_mcpw.runtime.min_version }}. Nothing has been changed.
    success_msg: >-
      {{ dc_mcpw.runtime.binary }}
      {{ (dc_mcpw_rt.stdout ~ ' ' ~ dc_mcpw_rt.stderr) | regex_search('[0-9]+\.[0-9]+(\.[0-9]+)?') }}
      as {{ dc_openclaw_user }} (floor {{ dc_mcpw.runtime.min_version }})

# --- the files: the reviewed bytes, nothing secret, nothing unfilled -----------
# Token shape = a run of 40+ [A-Za-z0-9_-] AFTER removing 64-hex digests and runs of
# 4+ punctuation ([-_]). A comment rule of hyphens is not a token (false positive seen
# on the host 2026-09-14); a real token split by dashes still is, because only the
# dashes are removed and the alphanumerics rejoin.
- name: Read each declared file from beside the artifact
  ansible.builtin.slurp:
    src: >-
      {{ (dc_mcp_wrapper_path | dirname | dirname) }}/{{
         item.value.source | regex_replace('^dc-task-maintenance/', '') }}
  loop: "{{ dc_mcpw.files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: dc_mcpw_files_src
  delegate_to: localhost
  become: false

- name: Refuse a declared file that is not the reviewed one or carries a secret shape
  ansible.builtin.assert:
    that:
      - (item.content | b64decode | hash('sha256')) == item.item.value.sha256
      - >-
        (item.content | b64decode | regex_replace('[0-9a-f]{64}', '') | regex_replace('[-_]{4,}', '')
         | regex_search('[A-Za-z0-9_-]{40,}')) is none
      - (item.content | b64decode | regex_search('(secret_|ntn_)[A-Za-z0-9]{8,}')) is none
      - item.item.value.dest is match('^/')
      - item.item.value.mode | default('') in ['0400', '0500', '0600', '0700']
    fail_msg: >-
      {{ item.item.key }}: source does not hash to {{ item.item.value.sha256[:16] }}…, or
      contains a token-shaped value, or its dest/mode is not an absolute path with a
      service-account-only mode. Nothing has been changed.
    success_msg: >-
      {{ item.item.key }} is the reviewed file ({{ item.item.value.sha256[:16] }}…),
      mode {{ item.item.value.mode }}
  loop: "{{ dc_mcpw_files_src.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Confirm the declared entrypoint is one of the declared files with the same digest
  ansible.builtin.assert:
    that:
      - dc_mcpw.server_package.entrypoint in (dc_mcpw.files | dict2items | map(attribute='value.dest') | list)
      - >-
        (dc_mcpw.files | dict2items | selectattr('value.dest', 'equalto', dc_mcpw.server_package.entrypoint)
         | map(attribute='value.sha256') | first) == dc_mcpw.server_package.entrypoint_sha256
    fail_msg: >-
      server_package.entrypoint / entrypoint_sha256 do not match a declared file. The
      entrypoint the wrapper execs must be one of the attested files. Nothing has been changed.
    success_msg: >-
      entrypoint {{ dc_mcpw.server_package.entrypoint }} attested
      ({{ dc_mcpw.server_package.entrypoint_sha256[:16] }}…)

- name: Gate the write
  ansible.builtin.include_tasks: apply_gate.yml
  vars:
    dc_apply_what: "stdio wrapper {{ dc_mcpw.wrapper.dest }} (--tags mcp-wrapper)"
    dc_apply_target: "{{ dc_mcpw.wrapper.dest }} (a file in the service account's home, NOT openclaw.json)"
    dc_apply_overlay:
      authority: "{{ dc_mcpw.authority }}"
      dest: "{{ dc_mcpw.wrapper.dest }}"
      mode: "{{ dc_mcpw.wrapper.mode | default('0700') }}"
      source_sha256: "{{ dc_mcpw.wrapper.expected_sha256 }}"
      server_package: "{{ dc_mcpw.server_package.name }}@{{ dc_mcpw.server_package.version }}"
      files: "{{ dc_mcpw.files | dict2items | map(attribute='value.dest') | list }}"
      env_file: "{{ dc_mcpw.env_file.path }} (stat only; never read)"

- name: Create the wrapper directory
  ansible.builtin.file:
    path: "{{ dc_mcpw.wrapper.dest | dirname }}"
    state: directory
    owner: "{{ dc_openclaw_user }}"
    group: "{{ dc_openclaw_user }}"
    mode: '0700'

- name: Place the wrapper
  ansible.builtin.copy:
    content: "{{ dc_mcpw_src.content | b64decode }}"
    dest: "{{ dc_mcpw.wrapper.dest }}"
    owner: "{{ dc_openclaw_user }}"
    group: "{{ dc_openclaw_user }}"
    mode: "{{ dc_mcpw.wrapper.mode | default('0700') }}"
  register: dc_mcpw_placed

- name: Create the declared file directories
  ansible.builtin.file:
    path: "{{ item.value.dest | dirname }}"
    state: directory
    owner: "{{ dc_openclaw_user }}"
    group: "{{ dc_openclaw_user }}"
    mode: '0700'
  loop: "{{ dc_mcpw.files | dict2items }}"
  loop_control:
    label: "{{ item.value.dest | dirname }}"

- name: Place each declared file at its declared mode
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ item.item.value.dest }}"
    owner: "{{ dc_openclaw_user }}"
    group: "{{ dc_openclaw_user }}"
    mode: "{{ item.item.value.mode }}"
  loop: "{{ dc_mcpw_files_src.results }}"
  loop_control:
    label: "{{ item.item.value.dest }}"

- name: Read each placed file back
  ansible.builtin.stat:
    path: "{{ item.value.dest }}"
    checksum_algorithm: sha256
    get_mime: false
  loop: "{{ dc_mcpw.files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: dc_mcpw_files_after

- name: Confirm every placed file is the reviewed one at its declared mode
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - (item.stat.checksum | default('')) == item.item.value.sha256
      - (item.stat.pw_name | default('')) == dc_openclaw_user
      - (item.stat.mode | default('')) == item.item.value.mode
    fail_msg: >-
      {{ item.item.key }} did not read back as the reviewed file at mode
      {{ item.item.value.mode }}; remove the directory before registering anything
    success_msg: "{{ item.item.key }} placed: sha256 matches, {{ item.stat.mode }} {{ dc_openclaw_user }}"
  loop: "{{ dc_mcpw_files_after.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Read the placed wrapper back
  ansible.builtin.stat:
    path: "{{ dc_mcpw.wrapper.dest }}"
    checksum_algorithm: sha256
    get_mime: false
  register: dc_mcpw_after

- name: Confirm the placed wrapper is the reviewed file with exactly the accepted mode
  ansible.builtin.assert:
    that:
      - dc_mcpw_after.stat.exists
      - (dc_mcpw_after.stat.checksum | default('')) == dc_mcpw.wrapper.expected_sha256
      - (dc_mcpw_after.stat.pw_name | default('')) == dc_openclaw_user
      - (dc_mcpw_after.stat.gr_name | default('')) == dc_openclaw_user
      - (dc_mcpw_after.stat.mode | default('')) == (dc_mcpw.wrapper.mode | default('0700'))
    fail_msg: >-
      The placed wrapper does not read back as the reviewed file with mode
      {{ dc_mcpw.wrapper.mode | default('0700') }} owned by {{ dc_openclaw_user }}.
      Remove {{ dc_mcpw.wrapper.dest }} before registering anything.
    success_msg: >-
      {{ dc_mcpw.wrapper.dest }} placed: sha256 matches,
      {{ dc_mcpw_after.stat.mode }} {{ dc_openclaw_user }}:{{ dc_openclaw_user }}

- name: Emit the wrapper placement and provenance receipt
  ansible.builtin.debug:
    msg: >-
      DC-MCP-WRAPPER RECEIPT |
      authority={{ dc_mcpw.authority.task_id }} / {{ dc_mcpw.authority.decision_memory_page_id }} |
      wrapper={{ dc_mcpw.wrapper.dest }} sha256={{ dc_mcpw.wrapper.expected_sha256[:16] }}…
      mode={{ dc_mcpw_after.stat.mode }} owner={{ dc_openclaw_user }}:{{ dc_openclaw_user }} |
      server_package={{ dc_mcpw.server_package.name }}@{{ dc_mcpw.server_package.version }}
      entrypoint={{ dc_mcpw.server_package.entrypoint }}
      entrypoint_sha256={{ dc_mcpw.server_package.entrypoint_sha256[:16] }}…
      files={{ dc_mcpw.files | dict2items | map(attribute='key') | list }}
      runtime={{ dc_mcpw.runtime.binary }}
      {{ (dc_mcpw_rt.stdout ~ ' ' ~ dc_mcpw_rt.stderr) | regex_search('[0-9]+\.[0-9]+(\.[0-9]+)?') }}
      source_head={{ dc_mcpw.server_package.source_head | default('NOT RECORDED') }} |
      env_file={{ dc_mcpw.env_file.path }} mode={{ dc_mcpw_env.stat.mode | default('?') }} (never read) |
      installed_nothing=true registered_nothing=true restarted_nothing=true |
      NOT PROVEN HERE: that the server starts and answers over stdio — the
      registration play's health check and the tool-surface probe settle that.
